
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="hainedot — 日々の余白に、言葉を置く。エッセイとコラムの小さな文芸サイト。">
  <title>hainedot — 日々の余白に、言葉を置く。</title>
  <style>
    :root {
      --paper: #faf9f6;
      --ink: #252522;
      --sub: #77746e;
      --line: #dedbd5;
      --accent: #77776d;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Yu Mincho", "Hiragino Mincho ProN",
                   "Noto Serif JP", serif;
      line-height: 2;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover { opacity: .65; }

    .container {
      width: min(100% - 48px, 980px);
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      width: min(880px, calc(100% - 80px));
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 40px 0 0;
      gap: 32px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 1rem;
      letter-spacing: -.06em;
      font-weight: normal;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1.75rem;
      font-size: 0.92rem;
      letter-spacing: .1em;
    }
    nav a { white-space: nowrap; }

    .hero {
      padding: 135px 0 125px;
      text-align: center;
    }

    .hero .small {
      color: var(--sub);
      font-size: 0.8rem;
      letter-spacing: .3em;
    }

    .hero h1 {
      font-size: 0.92rem;
      font-weight: normal;
      letter-spacing: .18em;
      line-height: 1.8;
      margin: 32px 0;
    }

    .hero p {
      color: var(--sub);
      font-size: 1rem;
      letter-spacing: .1em;
    }

    .ornament {
      margin: 55px auto 0;
      width: 1px;
      height: 75px;
      background: var(--line);
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 12px;
      margin-bottom: 30px;
    }

    .section-title h2 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 0.92rem;
      margin: 0;
      letter-spacing: .03em;
    }

    .section-title span {
      font-size: 0.8rem;
      color: var(--sub);
      letter-spacing: .12em;
    }

    .articles { margin-bottom: 120px; }

    .article {
      display: grid;
      grid-template-columns: 130px 1fr 80px;
      gap: 30px;
      align-items: start;
      padding: 34px 0;
      border-bottom: 1px solid var(--line);
    }

    .article time {
      font-family: Georgia, serif;
      color: var(--sub);
      font-size: 0.8rem;
    }

    .article h3 {
      font-size: 0.92rem;
      font-weight: normal;
      margin: 0 0 12px;
      letter-spacing: .05em;
    }

    .article p {
      margin: 0;
      font-size: 1rem;
      line-height: 2.2;
      color: var(--sub);
    }

    .category {
      font-size: 0.8rem;
      color: var(--sub);
      text-align: right;
      letter-spacing: .1em;
    }

    .about {
      padding: 96px 0 120px;
    }

    .about-inner {
      max-width: 650px;
      margin: 0 auto;
      text-align: center;
    }

    .about h2 {
      font-family: Georgia, serif;
      font-size: 0.92rem;
      font-weight: normal;
      margin: 0 0 30px;
    }

    .about p {
      font-size: 1rem;
      line-height: 2.8;
      color: #55534f;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 38px 0;
      font-family: Georgia, serif;
      font-size: 0.8rem;
      color: var(--sub);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    @media (max-width: 700px) {
      .header-inner {
        width: calc(100% - 40px);
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding-top: 28px;
      }
      nav { gap: 0.55rem 1.1rem; }
      .hero { padding: 95px 0 90px; }

      .article {
        display: block;
        padding: 27px 0;
      }

      .article time {
        display: block;
        margin-bottom: 12px;
      }

      .article h3 { font-size: 0.92rem; }
      .category { margin-top: 14px; text-align: left; }
      .about { padding: 75px 0; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container header-inner">
      <a class="logo" href="/">hainedot</a>
      <nav>
        <a href="new-blog.html">エッセイ</a>
        <a href="about.html">アバウト</a>
        <a href="profile.html">プロフィール</a>
        <a href="contact.html">コンタクト</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="about" id="about">
      <div class="container about-inner">
        <h2>About</h2>
        <p>
          hainedot は、日々の感情や思考を<br>
          文章として残していくための小さな場所です。<br>
          <br>
          文学、生活、愛情、孤独、そして表現について。<br>
          答えのない問いを、静かに書き続けます。
        </p>
      </div>
    </section>
  </main>
</body>
</html>
