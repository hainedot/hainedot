<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="まだ名前のない感情に、輪郭を。">
  <link rel="canonical" href="https://hainedot.com/">
  <title>hainedot</title>
  <script>
    if (location.pathname.endsWith("/index.html")) location.replace("/");
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #111; }
    body {
      color: #fff;
      font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.65; }
    .cover {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 68% center;
    }
    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.42) 0%, rgba(0, 0, 0, 0.12) 46%, rgba(0, 0, 0, 0) 72%);
    }
    .site-nav {
      position: absolute;
      top: 28px;
      right: 6vw;
      z-index: 1;
    }
    .site-nav ul {
      display: flex;
      gap: 1.4rem;
      list-style: none;
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
    }
    .copy {
      position: absolute;
      z-index: 1;
      left: 6vw;
      top: 26vh;
      width: min(920px, 86vw);
    }
    .kicker {
      margin: 0 0 28px;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 4.8vw, 68px);
      font-weight: normal;
      line-height: 1.35;
      letter-spacing: 0.08em;
    }
    .sub {
      margin: 34px 0 0;
      font-size: 14px;
      letter-spacing: 0.14em;
    }
    @media (max-width: 640px) {
      .site-nav { top: 20px; right: 20px; }
      .site-nav ul { gap: 0.8rem; font-size: 10px; }
      .copy { left: 20px; top: 22vh; width: calc(100% - 40px); }
      .kicker { font-size: 9px; letter-spacing: 0.14em; }
      h1 { font-size: 32px; letter-spacing: 0.04em; }
      .sub { font-size: 13px; }
    }
  </style>
</head>
<body>
  <section class="cover">
    <img src="images/profile.jpg" alt="">
    <div class="shade" aria-hidden="true"></div>
    <nav class="site-nav" aria-label="サイト">
      <ul>
        <li><a href="new-blog.html">エッセイ</a></li>
        <li><a href="profile.html">プロフィール</a></li>
        <li><a href="contact.html">コンタクト</a></li>
      </ul>
    </nav>
    <div class="copy">
      <p class="kicker">HAINE DOT — AN INDEPENDENT LITERARY SPACE</p>
      <h1>まだ名前のない感情に、<br>輪郭を。</h1>
      <p class="sub">言葉になる前の、曖昧なものたちへ。</p>
    </div>
  </section>
</body>
</html>
