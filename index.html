<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="このコーヒーが飲み終わるまで">
  <link rel="canonical" href="https://hainedot.com/">
  <title>hainedot</title>
  <script>
    if (location.pathname.endsWith("/index.html")) location.replace("/");
  </script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: #1c1c1c; }
    body {
      font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      line-height: 1.9;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.6; }
    header {
      width: min(880px, calc(100% - 80px));
      margin: 0 auto;
      padding: 40px 0 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 32px;
    }
    .brand { letter-spacing: 0.14em; font-size: 1rem; }
    .site-nav ul {
      display: flex;
      gap: 1.75rem;
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
    }
    .hero {
      display: block;
      width: min(560px, calc(100% - 120px));
      height: auto;
      margin: 88px auto 0;
    }
    .line {
      margin: 56px 24px 0;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      text-align: center;
    }
    .place {
      width: min(560px, calc(100% - 48px));
      margin: 28px auto 120px;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-align: center;
    }
    @media (max-width: 640px) {
      header {
        width: min(880px, calc(100% - 48px));
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
        padding-top: 32px;
      }
      .site-nav ul { gap: 1.15rem; }
      .hero {
        width: min(560px, calc(100% - 64px));
        margin-top: 64px;
      }
      .line { margin-top: 40px; }
      .place { margin-top: 20px; margin-bottom: 88px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">hainedot</a>
    <nav class="site-nav" aria-label="サイト">
      <ul>
        <li><a href="new-blog.html">エッセイ</a></li>
        <li><a href="profile.html">プロフィール</a></li>
        <li><a href="contact.html">コンタクト</a></li>
      </ul>
    </nav>
  </header>

  <img class="hero" src="images/profile.jpg" alt="コーヒーを飲む横顔">
  <p class="line">このコーヒーが飲み終わるまで</p>
  <p class="place">hainedot. は、エッセイと言葉のための小さな場所です。</p>
</body>
</html>
