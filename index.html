<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="このコーヒーが飲み終わるまで">
  <link rel="canonical" href="https://hainedot.com/">
  <title>hainedot</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: #1c1c1c; }
    body {
      font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      line-height: 1.85;
    }
    .hero {
      display: block;
      width: 100%;
      height: auto;
    }
    .line {
      margin: 36px 16px 0;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      text-align: center;
    }
    .page {
      width: min(640px, calc(100% - 40px));
      margin: 0 auto;
      padding-bottom: 88px;
    }
    nav { margin-top: 40px; }
    nav ul {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    a { color: inherit; }
    section { margin-top: 72px; }
    h1 {
      margin: 0 0 16px;
      font-size: 0.95rem;
      font-weight: normal;
      letter-spacing: 0.16em;
    }
    p { margin: 0; }
    dl { margin: 20px 0 0; }
    dt { font-size: 0.82rem; letter-spacing: 0.08em; }
    dd { margin: 0 0 14px; }
    .contact { margin: 16px 0 0; padding-left: 1.15rem; }
  </style>
</head>
<body>
  <img class="hero" src="images/profile.jpg" alt="コーヒーを飲む横顔">
  <p class="line">このコーヒーが飲み終わるまで</p>

  <main class="page">
    <nav aria-label="ページ内">
      <ul>
        <li><a href="#profile">プロフィール</a></li>
        <li><a href="#contact">コンタクト</a></li>
      </ul>
    </nav>

    <section id="profile">
      <h1>プロフィール</h1>
      <p>写真と詩を重ねながら、日常の光を記録しています。</p>
      <dl>
        <dt>名前</dt>
        <dd>hainedot</dd>
        <dt>活動</dt>
        <dd>写真撮影 / 短詩の執筆</dd>
        <dt>拠点</dt>
        <dd>日本 静岡</dd>
      </dl>
    </section>

    <section id="contact">
      <h1>コンタクト</h1>
      <p>お問い合わせ・ご感想は、下記よりお気軽にどうぞ。</p>
      <ul class="contact">
        <li>サイト：<a href="https://hainedot.com">hainedot.com</a></li>
        <li>メール：<a href="mailto:hainedottt@gmail.com">hainedottt@gmail.com</a></li>
        <li>X：<a href="https://x.com/hainedot" target="_blank" rel="noopener noreferrer">@hainedot</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
